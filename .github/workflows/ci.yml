name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AppStart.slnx

      - name: Build
        run: dotnet build AppStart.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution AppStart.slnx -c Release --no-build --report-xunit-trx --results-directory TestResults

      # Failed tests as annotations: readable on the run page and via the public API, without log access.
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName -Raw
            foreach ($r in $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed') {
              $msg = "$($r.Output.ErrorInfo.Message)" -replace '\r?\n', ' ' -replace '%', '%25'
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) + ' ...' }
              $title = "$($r.testName)" -replace '%', '%25' -replace ',', '%2C' -replace ':', '%3A'
              Write-Output "::error title=$title::$msg"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: TestResults/
          if-no-files-found: warn
