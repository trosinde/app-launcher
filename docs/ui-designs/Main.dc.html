<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Setup – Applikationen auswählen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:#1b1b1b}
a{color:#0f5299}a:hover{color:#0a3a6e}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; background: #f3f3f3; display: flex; flex-direction: column; font-family: 'Segoe UI', system-ui, sans-serif; color: #1b1b1b">
  <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 16px; background: #ffffff; border-bottom: 1px solid #e0e0e0">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f5299" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="1"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span>AppStart Setup</span>
    </div>
    <button aria-label="Schliessen" style="width: 46px; height: 40px; border: 0; background: transparent; font-size: 16px; color: #1b1b1b">✕</button>
  </div>
  <div style="display: flex; flex: 1; min-height: 0">
    <nav style="width: 220px; background: #eaeef3; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
      <div style="padding: 10px 12px; background: #ffffff; border-radius: 4px; font-weight: 600; color: #0f5299">1  Applikationen</div>
      <div style="padding: 10px 12px; color: #4a4a4a">2  Konten und Gruppe</div>
      <div style="padding: 10px 12px; color: #4a4a4a">3  Zusammenfassung</div>
    </nav>
    <main style="flex: 1; padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; min-width: 0">
      <div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Applikationen auswählen</h1>
        <p style="margin: 6px 0 0; font-size: 14px; color: #4a4a4a">Diese Applikationen starten Bediener künftig über den Start-Dienst. Jede bekommt eine eigene Verknüpfung mit ihrem Icon.</p>
      </div>
      <div style="background: #ffffff; border: 1px solid #d6d6d6; border-radius: 4px; display: flex; flex-direction: column">
        <div style="display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) 140px; align-items: center; padding: 8px 12px; font-size: 12px; font-weight: 600; color: #4a4a4a; border-bottom: 1px solid #e0e0e0">
          <span></span><span></span><span>Applikation</span><span>Prüfung</span>
        </div>
        <label style="display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) 140px; align-items: center; padding: 10px 12px; background: #e6f0fa; font-size: 14px">
          <input type="checkbox" checked style="width: 18px; height: 18px">
          <span style="width: 28px; height: 28px; background: #0f5299; border-radius: 4px; display: block" aria-hidden="true"></span>
          <span style="display: flex; flex-direction: column; min-width: 0"><strong style="font-weight: 600">Applikation A</strong><span style="font-size: 12px; color: #4a4a4a">C:\Program Files\Hersteller\AppA\AppA.exe</span></span>
          <span style="font-size: 13px">Signatur</span>
        </label>
        <label style="display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) 140px; align-items: center; padding: 10px 12px; border-top: 1px solid #eeeeee; font-size: 14px">
          <input type="checkbox" checked style="width: 18px; height: 18px">
          <span style="width: 28px; height: 28px; background: #2e7d4f; border-radius: 4px; display: block" aria-hidden="true"></span>
          <span style="display: flex; flex-direction: column; min-width: 0"><strong style="font-weight: 600">Applikation B</strong><span style="font-size: 12px; color: #4a4a4a">C:\Program Files\Hersteller\AppB\AppB.exe</span></span>
          <span style="font-size: 13px">SHA-256</span>
        </label>
        <label style="display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) 140px; align-items: center; padding: 10px 12px; border-top: 1px solid #eeeeee; font-size: 14px">
          <input type="checkbox" style="width: 18px; height: 18px">
          <span style="width: 28px; height: 28px; background: #6b6b6b; border-radius: 4px; display: block" aria-hidden="true"></span>
          <span style="display: flex; flex-direction: column; min-width: 0"><strong style="font-weight: 600">AppStart TestApp</strong><span style="font-size: 12px; color: #4a4a4a">C:\Program Files\AppStart\TestApp\AppStart.TestApp.exe</span></span>
          <span style="font-size: 13px">Signatur</span>
        </label>
        <div style="display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e0e0e0">
          <button style="height: 32px; padding: 0 14px; border: 1px solid #c4c4c4; background: #ffffff; border-radius: 4px; font-size: 13px">EXE hinzufügen…</button>
          <button style="height: 32px; padding: 0 14px; border: 1px solid #c4c4c4; background: #ffffff; border-radius: 4px; font-size: 13px">Entfernen</button>
        </div>
      </div>
      <div style="background: #ffffff; border: 1px solid #d6d6d6; border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 13px; font-weight: 600">Schutz für Applikation A</div>
        <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 100px; gap: 8px 10px; align-items: center; font-size: 13px">
          <label for="dd">Datenordner</label>
          <input id="dd" value="C:\ProgramData\Hersteller\AppA" style="height: 30px; border: 1px solid #c4c4c4; border-radius: 4px; padding: 0 8px; font-size: 13px">
          <button style="height: 30px; border: 1px solid #c4c4c4; background: #ffffff; border-radius: 4px; font-size: 13px">Durchsuchen…</button>
          <label for="rk">Registry-Key</label>
          <input id="rk" value="HKLM\SOFTWARE\Hersteller\AppA" style="height: 30px; border: 1px solid #c4c4c4; border-radius: 4px; padding: 0 8px; font-size: 13px">
          <span style="font-size: 12px; color: #4a4a4a">wird gesperrt</span>
        </div>
      </div>
      <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px">
        <button style="height: 34px; min-width: 96px; border: 1px solid #c4c4c4; background: #ffffff; border-radius: 4px; font-size: 14px">Abbrechen</button>
        <button style="height: 34px; min-width: 96px; border: 0; background: #0f5299; color: #ffffff; border-radius: 4px; font-size: 14px; font-weight: 600">Weiter</button>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
