<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <title>AppStart – Funktionsweise</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f5299"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Operator session -->
  <rect x="10" y="10" width="300" height="300" rx="8" fill="#f2f7fc" stroke="#9fb9d6"/>
  <text x="24" y="32" font-weight="600" fill="#0f3d6e">Sitzung des Bedieners (ohne Admin-Rechte)</text>

  <rect x="30" y="50" width="120" height="54" rx="6" fill="#fff" stroke="#0f5299"/>
  <text x="90" y="72" text-anchor="middle" font-weight="600">Verknüpfung</text>
  <text x="90" y="90" text-anchor="middle" fill="#52606d">Icon der Applikation</text>

  <rect x="30" y="140" width="120" height="66" rx="6" fill="#fff" stroke="#0f5299"/>
  <text x="90" y="162" text-anchor="middle" font-weight="600">Launcher</text>
  <text x="90" y="180" text-anchor="middle" fill="#52606d">--app &lt;AppId&gt;</text>
  <text x="90" y="196" text-anchor="middle" fill="#52606d">Meldung bei Fehler</text>

  <rect x="170" y="200" width="125" height="96" rx="6" fill="#e9f6ec" stroke="#2f855a"/>
  <text x="232" y="222" text-anchor="middle" font-weight="600">Applikation</text>
  <text x="232" y="240" text-anchor="middle" fill="#2f4f3a">läuft als appstart-app</text>
  <text x="232" y="256" text-anchor="middle" fill="#2f4f3a">mit Admin-Rechten,</text>
  <text x="232" y="272" text-anchor="middle" fill="#2f4f3a">im Job-Objekt</text>
  <text x="232" y="288" text-anchor="middle" fill="#2f4f3a">(keine Kindprozesse)</text>

  <line x1="90" y1="104" x2="90" y2="138" stroke="#0f5299" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="98" y="125" fill="#0f5299">1 Klick</text>

  <!-- Pipe -->
  <line x1="150" y1="166" x2="438" y2="166" stroke="#0f5299" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="300" y="158" text-anchor="middle" fill="#0f5299">2 START &lt;AppId&gt;</text>
  <text x="300" y="184" text-anchor="middle" fill="#52606d">Named Pipe \\.\pipe\AppStart</text>
  <text x="300" y="198" text-anchor="middle" fill="#52606d">nur Gruppe AppStart Users, nur lokal</text>
  <line x1="438" y1="128" x2="152" y2="128" stroke="#0f5299" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="300" y="121" text-anchor="middle" fill="#0f5299">6 OK oder DENIED &lt;Grund&gt; &lt;Vorgang&gt;</text>

  <!-- Service -->
  <rect x="440" y="10" width="310" height="300" rx="8" fill="#fdf6e9" stroke="#d4a017"/>
  <text x="454" y="32" font-weight="600" fill="#7a5b00">Dienst AppStart (LocalSystem, Session 0)</text>
  <text x="456" y="62">3 Session und Benutzer des Anfragenden</text>
  <text x="472" y="78" fill="#52606d">eine Anfrage je Session, 2 s Sperrzeit</text>
  <text x="456" y="104">4 apps.json lesen und Dateirechte prüfen</text>
  <text x="472" y="120" fill="#52606d">AppId freigegeben?</text>
  <text x="456" y="146">5 EXE sperren, Signatur oder SHA-256</text>
  <text x="472" y="162" fill="#52606d">bleibt gesperrt bis zum Start</text>
  <text x="456" y="188">Anmeldung appstart-app ohne Passwort (S4U)</text>
  <text x="456" y="208">Start in der Sitzung des Bedieners</text>
  <text x="456" y="234">Jede Anfrage ins Ereignisprotokoll</text>
  <text x="472" y="250" fill="#52606d">Anwendung, Quelle AppStart, ID 1000–1302</text>

  <line x1="440" y1="208" x2="297" y2="240" stroke="#2f855a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Data -->
  <rect x="440" y="330" width="150" height="96" rx="6" fill="#fff" stroke="#7b8794"/>
  <text x="515" y="350" text-anchor="middle" font-weight="600">C:\ProgramData\AppStart</text>
  <text x="515" y="368" text-anchor="middle" fill="#52606d">apps.json</text>
  <text x="515" y="384" text-anchor="middle" fill="#52606d">Prüfberichte</text>
  <text x="515" y="404" text-anchor="middle" fill="#52606d">nur SYSTEM und</text>
  <text x="515" y="418" text-anchor="middle" fill="#52606d">Administratoren</text>

  <rect x="600" y="330" width="150" height="96" rx="6" fill="#fff" stroke="#7b8794"/>
  <text x="675" y="350" text-anchor="middle" font-weight="600">Daten der Applikation</text>
  <text x="675" y="368" text-anchor="middle" fill="#52606d">Datenordner</text>
  <text x="675" y="384" text-anchor="middle" fill="#52606d">Registry-Key (HKLM)</text>
  <text x="675" y="404" text-anchor="middle" fill="#52606d">nur appstart-app, SYSTEM,</text>
  <text x="675" y="418" text-anchor="middle" fill="#52606d">Administratoren</text>
  <line x1="515" y1="310" x2="515" y2="328" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arrowGrey)"/>

  <!-- Setup -->
  <rect x="10" y="330" width="300" height="96" rx="8" fill="#f4f4f5" stroke="#7b8794"/>
  <text x="24" y="352" font-weight="600" fill="#323f4b">AppStart.Setup (Installateur, Admin-Rechte)</text>
  <text x="24" y="372" fill="#52606d">Applikationen freigeben, Konten und Gruppe,</text>
  <text x="24" y="388" fill="#52606d">Rechte sperren, Verknüpfungen anlegen,</text>
  <text x="24" y="404" fill="#52606d">Einrichtung prüfen (verify)</text>
  <line x1="310" y1="378" x2="438" y2="378" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arrowGrey)"/>
  <text x="374" y="370" text-anchor="middle" fill="#7b8794">schreibt</text>
</svg>
